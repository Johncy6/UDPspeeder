name: UDPspeeder CI/CD Pipeline

on:
  push:
    branches: [ "branch_libev" ]
  pull_request:
    branches: [ "branch_libev" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-12, windows-2022]
        include:
          - os: ubuntu-22.04
            build-cmd: make
          - os: macos-12
            build-cmd: make
          - os: windows-2022
            build-cmd: nmake
      fail-fast: false

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup build environment
        shell: bash
        run: |
          case ${{ matrix.os }} in
            ubuntu*)
              sudo apt-get update
              sudo apt-get install -y build-essential cmake
              ;;
            macos*)
              brew update
              brew install make cmake
              ;;
            windows*)
              choco install make cmake
              ;;
          esac
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: 1  # ‌:ml-citation{ref="2,6" data="citationList"}

      - name: Compile binaries
        run: ${{ matrix.build-cmd }}
        working-directory: ./src  # ‌:ml-citation{ref="4" data="citationList"}

      - name: Run smoke test
        run: |
          ./udpspeed -v || true  # ‌:ml-citation{ref="4,8" data="citationList"}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udpspeeder-${{ matrix.os }}
          path: |
            ./udpspeed*
            ./output/*
          retention-days: 7  # ‌:ml-citation{ref="6,7" data="citationList"}

  release:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/udpspeeder-*
          generate_release_notes: true
