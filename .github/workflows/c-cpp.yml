name: Build Windows Binary

on:
  push:
    branches: [ branch_libev ]
  pull_request:
    branches: [ branch_libev ]

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y g++ make mingw-w64 zip

    - name: Build with MinGW
      run: |
        make mingw_cross

    - name: Archive output
      run: |
        zip -j udp2raw_windows_build.zip udp2raw_mp.exe

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: udp2raw_windows_build
        path: udp2raw_windows_build.zip
