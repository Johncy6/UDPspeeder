name: Build UDPspeeder (Windows EXE)

on:
  push:
    branches:
      - branch_libev
  pull_request:
    branches:
      - branch_libev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出指定分支代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: branch_libev

      # 安装构建依赖
      # 其中 mingw-w64 用于交叉编译 Windows 可执行文件
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential mingw-w64

      # 调用 makefile 中的 mingw_cross 目标来编译 Windows exe 文件
      - name: Build Windows executable
        run: make mingw_cross

      # 上传生成的 exe 文件构建产物（假设生成文件为 speederv2.exe）
      - name: Upload EXE Artifact
        uses: actions/upload-artifact@v3
        with:
          name: speederv2-exe
          path: speederv2.exe
